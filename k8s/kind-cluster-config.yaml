kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

# containerd mirrors match host-side /etc/docker/daemon.json (k8s/host/daemon.json).
# Upstreams are HTTPS with default empty creds — no [registry.configs.*] block needed.
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      [plugins."io.containerd.grpc.v1.cri".registry.mirrors]
        [plugins."io.containerd.grpc.v1.cri".registry.mirrors."docker.io"]
          endpoint = ["https://docker.mirrors.ustc.edu.cn", "https://hub-mirror.c.163.com", "https://dockerproxy.1panel.live", "https://docker.m.daocloud.io", "https://dockerhub.icu"]
        [plugins."io.containerd.grpc.v1.cri".registry.mirrors."quay.io"]
          endpoint = ["https://quay.mirrors.ustc.edu.cn"]
        [plugins."io.containerd.grpc.v1.cri".registry.mirrors."gcr.io"]
          endpoint = ["https://gcr.mirrors.ustc.edu.cn", "https://registry.aliyuncs.com/google_containers"]

# 1 control-plane + 5 workers. Extra workers isolate daemons and stateful workloads
# from single-node restarts.
nodes:
  - role: control-plane
  - role: worker
  - role: worker
  - role: worker
  - role: worker
  - role: worker

networking:
  # Keep kindnet (default). To swap CNIs, set disableDefaultCNI: true + podSubnet,
  # then apply the replacement manifest — two CNIs on one cluster is broken.
  disableDefaultCNI: false
  kubeProxyMode: "nftables"