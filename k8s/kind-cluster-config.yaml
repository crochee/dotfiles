kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# containerd 2.x (kind v0.27+ node image) 移除了 registry.mirrors, 镜像走
# /etc/containerd/certs.d 的 hosts.toml (见 k8s/certs.d/, 部署步骤在
# kind-cluster-guide.md「Registry mirrors」). config_path 在 v0.27+ image 里
# 本就是默认值, 本 patch 只服务更老的 node image (如 v1.31).
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"

nodes:
  - role: control-plane
    # Control plane high availability (uncomment to enable)
    # replicas: 3
  - role: worker
  - role: worker
  - role: worker

networking:
  # kind 自带 kindnet 作为默认 CNI —— 保持启用，集群建好即可用。
  # 要用别的 CNI（如 Calico）必须同时改成 true 并给出 podSubnet，否则两套
  # CNI 抢管 pod 网络。切换步骤见 kind-cluster-guide.md。
  disableDefaultCNI: false

  # Use IPVS for kube-proxy for better performance and scalability
  kubeProxyMode: "ipvs"
