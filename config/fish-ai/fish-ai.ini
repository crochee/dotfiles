# fish-ai 配置（仓库软链到 ~/.config/fish-ai.ini）
# 装：fisher install realiserad/fish-ai（已在 config/fish/fish_plugins）
# 文档：https://github.com/Realiserad/fish-ai
#
# 密钥策略：复用 system/.env.local 的 OPENAI_API_KEY（fish-ai 的 ConfigParser
# 用 path.expandvars，$OPENAI_API_KEY 会从 env 展开；不读环境变量直查，绕过 keyring）。
# 这样：
#   - 密钥不写进仓库
#   - 切 provider 只需改 system/.env.local 的 OPENAI_BASE_URL / OPENAI_API_KEY
#   - 不依赖系统 keyring 守护进程

[fish-ai]
progress_indicator = ⏳

[deepseek]
provider = deepseek
model = deepseek-chat
api_key = $OPENAI_API_KEY
