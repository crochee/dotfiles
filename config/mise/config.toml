# mise 配置文件

[settings]
# 启用 lockfile
lockfile = true
env_file = '.env'
experimental = true
jobs = 8

# 环境变量配置示例
[env]

[tools]
# 一律 mise 管理；例外见 install/tools.sh（docker 守护进程随系统包管理器）
# runtimes
node = "latest"
python = "latest"
rust = "latest"
go = "latest"
bun = "latest"
uv = "latest"
# CLI（registry 默认走 aqua 预编译二进制）
lazygit = "latest"
kind = "latest"
zoxide = "latest"
starship = "latest"
fd = "latest"
ripgrep = "latest"
bat = "latest"
neovim = "latest"
"github:can1357/oh-my-pi" = "latest"
