format = "$all\n$character"
add_newline = false

[line_break]
disabled = true

[battery]
full_symbol = "🔋 "
charging_symbol = "🔌 "
discharging_symbol = "⚡"

[[battery.display]]
threshold = 10
style = "bold red"

[[battery.display]]
threshold = 25
style = "bold orange"

[[battery.display]]
threshold = 50
style = "bold yellow"

[[battery.display]]
threshold = 100
style = "bold green"

[character]
error_symbol = "[✗](bold #ff0000)"
success_symbol = "[➤](bold #ea00d9)"

[cmd_duration]
min_time = 10_000
format = " took [$duration]($style)"

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold #f57800"
read_only = "🔒"
read_only_style = "bold white"

[git_branch]
format = " [$symbol$branch]($style) "
style = "bold yellow"

[git_commit]
commit_hash_length = 8
style = "bold white"

[git_status]
conflicted = "⚔️ "
ahead = "🏎️ 💨 ↑${count}"
behind = "🐢 ↓×${count}"
diverged = "🔱 🏎️ 💨 ↑×${ahead_count} 🐢 ↓×${behind_count}"
untracked = "🛤️  ×${count}"
stashed = "📦 "
modified = "📝 ×${count}"
staged = "🗃️  ×${count}"
renamed = "📛 ×${count}"
deleted = "🗑️  ×${count}"
style = "bright-white"
format = "$all_status$ahead_behind"

[hostname]
disabled = true

[memory_usage]
format = "$symbol[${ram}( | ${swap})]($style) "
threshold = 50
style = "bold dimmed white"
disabled = false

[package]
disabled = true

[python]
format = "[$symbol$version]($style) "
style = "bold #f57800"

[kubernetes]
disabled = false
format = "[$context]($style) "
style = "bold #00afff"

[time]
disabled = false
format = '🕙[\[$time\]]($style) '
time_format = "%T"

[username]
style_user = "bold #ea00d9"
show_always = true
format = "[$user]($style)"