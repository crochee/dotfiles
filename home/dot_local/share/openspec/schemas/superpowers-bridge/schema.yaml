name: superpowers-bridge
version: 2
description: >
  规范驱动工作流 + superpowers skill 执行器的桥接。
  前置依赖:superpowers 插件,提供 brainstorming、writing-plans、using-git-worktrees、
  subagent-driven-development、finishing-a-development-branch(传递:test-driven-development、
  requesting-code-review)。
  平台要求:必须支持 subagent(Claude Code、Codex 等);不支持的运行时改用内置 spec-driven
  —— executing-plans 不会传递激活 TDD 与 code-review。
  各 artifact / apply 步骤调用前校验 skill,缺失即报错中止,不降级。
  流程顺序:brainstorm → proposal → specs → tasks → plan → verify → retrospective;
  design 为必需产物(承接 brainstorm 重组),被 tasks 与 plan 引用。

artifacts:
  - id: brainstorm
    generates: brainstorm.md
    description: 用 brainstorming skill 做协作式设计探索
    template: brainstorm.md
    instruction: |
      PRECHECK — 依赖 skill 存在性(硬性,不可降级):
      本步骤开始前,确认下列 skill 全部出现在可用 skill 列表中:
        - brainstorming
      任一缺失:立即停止本步骤,列出缺失的 skill 名称,并提示安装位置
      (`~/.agents/skills/<name>/SKILL.md`,或 superpowers 插件提供的同名 skill)。
      不要自行降级、不要改用其他 skill、不要手写产物绕过。

      用 Skill 工具调用 **brainstorming**。

      重要:输出重定向
      - 不要写入 `docs/superpowers/specs/`。改为把 brainstorming 的产出直接写进本 change 的 `brainstorm.md`。
      - `brainstorm.md` 是**原始捕获**:原样写下 brainstorming skill 的完整产出,不套模板结构。
        skill 的自然产出通常是决策日志(背景 → 决策链 Q1-Qn → 设计取舍),但格式随对话内容变化,
        保留它自带的组织方式。
      - 本步骤不要预填 `design.md`。`design.md` 是独立产物,负责把 `brainstorm.md` 的内容重组成
        结构化章节(背景 / 目标 / 决策 / 风险 / 迁移)。这次转换发生在 design 步骤。

      brainstorming skill 会:
      1. 探索项目上下文
      2. 逐个提出澄清问题(一次一个)
      3. 给出 2-3 个方案与取舍
      4. 分节呈示设计待确认
      5. 输出确认后的设计
    requires: []

  - id: proposal
    generates: proposal.md
    description: 概述本次变更的初始提案
    template: proposal.md
    instruction: |
      基于 brainstorming 的产出编写提案文档。

      读 `brainstorm.md` 拿确认后的设计,抽取:
      - **Why**:变更动机(来自 brainstorming 讨论)。
      - **What Changes**:达成一致的具体变更。
      - **Capabilities**:识别将新建或修改哪些 spec:
        - **New Capabilities**:本次引入的能力。每个能力对应一个新建的 `specs/<name>/spec.md`,命名用 kebab-case。
        - **Modified Capabilities**:既有能力中 REQUIREMENTS 发生变化的部分。先查 `openspec/specs/` 里的既有 spec 名。
      - **Impact**:受影响的代码、API、依赖或系统。

      brainstorming 已经探索过问题空间,这里只做提取,不要重新探索。

      重要:Capabilities 段是关键 —— 它是 proposal 与 specs 阶段之间的契约,
      这里列出的每个能力都必须有对应的 spec 文件。

      篇幅控制在 1-2 页,重 why 轻 how。
    requires:
      - brainstorm

  - id: design
    generates: design.md
    description: 说明如何实现的技术设计文档
    template: design.md
    instruction: |
      编写设计文档,说明**如何**实现本次变更。

      以 `brainstorm.md` 为输入。`brainstorm.md` 是 brainstorming skill 产出的原始捕获
      (通常是带 Q1-Qn 决策、取舍与背景的决策日志)。你的工作是**重组**这些内容到下列结构化章节 ——
      这是一次转换,不是复制:
      - 决策(brainstorm 里的 Q1-Qn)→ design.md §决策
      - 背景 / 上下文 → design.md §背景
      - 取舍 → design.md §风险 / 取舍
      - 补出目标 / 非目标与迁移计划(必要时从 brainstorm.md 内容推断)

      章节:
      - **背景**:背景、现状、约束、利益相关方
      - **目标 / 非目标**:本设计要达成什么、明确排除什么
      - **决策**:关键技术选择及其理由(为什么选 X 不选 Y)。每个决策写出已考虑的替代方案与否决原因。
      - **风险 / 取舍**:已知限制、可能出错的地方。格式:`[Risk] 描述 → Mitigation: 缓解措施`;
        `[Trade-off] 描述 → 接受理由`
      - **迁移计划**:部署步骤、回滚策略(如有)
      - **待定问题**:尚未决定或未知的点

      关注架构与做法,不要写逐行实现。好的设计文档解释技术决策背后的"为什么"。
    requires:
      - brainstorm

  - id: specs
    generates: "specs/**/*.md"
    description: 定义系统应当做什么的详细规格
    template: spec.md
    instruction: |
      编写规格文件,定义系统**应当做什么**。

      为 proposal 的 Capabilities 段里列出的每个能力建一个 spec 文件:
      - 新增能力:用 proposal 里确切的 kebab-case 名(specs/<capability>/spec.md)。
      - 修改既有能力:用 `openspec/specs/<capability>/` 里的既有目录名,
        在 `specs/<capability>/spec.md` 写 delta spec。

      Delta 操作(用 `##` 标题):
      - **ADDED Requirements**:新增能力
      - **MODIFIED Requirements**:行为变更 —— MUST 给出修改后的完整内容
      - **REMOVED Requirements**:废弃能力 —— MUST 含 **Reason** 与 **Migration**
      - **RENAMED Requirements**:仅改名 —— 用 FROM:/TO: 格式

      格式要求:
      - 每条 requirement:`### Requirement: <name>` + 描述正文
      - 规范性表述用 SHALL / MUST(避免 should / may)
      - 每个 scenario:`#### Scenario: <name>` + WHEN / THEN 格式
      - **关键**:scenario 必须正好用 4 个 `#`(`####`)。用 3 个 `#` 或 bullet 会静默失效。
      - 每条 requirement 至少要有 1 个 scenario。

      spec 必须可测 —— 每个 scenario 都是一个潜在测试用例。
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: 可追踪的实施清单
    template: tasks.md
    instruction: |
      编写任务清单,把实施工作拆解出来。

      **重要:严格按下面的模板格式写。** apply 阶段靠解析复选框来追踪进度,
      不是 `- [ ]` 格式的任务不会被计入进度。

      编写准则:
      - 相关任务归到 `## N.` 编号标题下分组
      - 每个任务必须是复选框:`- [ ] X.Y 任务描述`
      - 单个任务的体量控制在一次 session 内能完成
      - 组内按依赖顺序排列(先做哪个?)

      做什么看 specs,怎么做看 `design.md`(架构决策、取舍、迁移)。
    requires:
      - specs
      - design

  - id: plan
    generates: plan.md
    description: 用 writing-plans skill 生成的微任务实施计划
    template: plan.md
    instruction: |
      PRECHECK — 依赖 skill 存在性(硬性,不可降级):
      本步骤开始前,确认下列 skill 全部出现在可用 skill 列表中:
        - writing-plans
      任一缺失:立即停止本步骤,列出缺失的 skill 名称,并提示安装位置
      (`~/.agents/skills/<name>/SKILL.md`,或 superpowers 插件提供的同名 skill)。
      不要自行降级、不要改用其他 skill、不要手写产物绕过。

      用 Skill 工具调用 **writing-plans**。

      重要:输出重定向
      - 不要写入 `docs/superpowers/plans/`。改为把计划直接写进本 change 的 `plan.md`。

      把 `tasks.md` 的内容作为分解输入传给 skill。writing-plans skill 会:
      1. 读 `tasks.md` 与 `design.md` 获取上下文
      2. 把每个任务拆成 2-5 分钟粒度的微步骤(TDD 风格)
      3. 给出精确的文件路径、代码片段、测试命令
      4. 在每个任务后加 commit 点

      计划要引用本 change 目录下的 specs 与 design 产物。
      需要人工 / dogfood / 现场环境才能验证的步骤,在 `plan.md` 里把复选框标记为 `- [~]`,
      不要留成 `- [ ]` —— verify 阶段靠它做"延后的人工验证 vs 自动化测试"等价性判定。
    requires:
      - tasks

  - id: verify
    generates: verify.md
    description: 实现后对照 specs、design、tasks 的验收
    template: verify.md
    instruction: |
      PRECHECK — 实现证据(证据型):
      产出 verify.md 前,下列两条命令都必须执行,返回数必须 > 0;任一返回 0,立即停止并告知用户:
      apply 阶段还没有产出可评审的变更。

      1. commit 证据(必须 > 0):
         git log --oneline $(git merge-base HEAD origin/main 2>/dev/null || git merge-base HEAD origin/master 2>/dev/null)..HEAD | wc -l

      2. 任务进度(必须 > 0):
         grep -c '^- \[x\]' openspec/changes/<change-name>/tasks.md

      两条都返回正数之后,再调用下面的验证 skill。

      用 Skill 工具调用 **openspec-verify-change**(用户可见的等价物是 `/opsx:verify`)。

      重要:时序说明
      - 与其他产物不同,`verify.md` 在 apply 阶段**结束后**产出,而不是规划期间产出。
        `requires: [plan]` 这条边只是为了满足 schema 依赖图 —— 真正的验证步骤必须跑在
        已完成的实现上。

      verify 步骤必须完成下列检查,并用模板把结果记进 verify.md:

      1. **结构校验**:在仓库根执行 `openspec validate --all --json`,确认每一项都是
         `"valid": true`。有失败项就记录问题,回到出问题的产物修正后重跑。

      2. **任务完成度**:确认 `tasks.md` 里每个复选框都是 `- [x]`。仍为 `- [ ]` 的,
         记录原因(手动 / 超范围 / 被阻塞)以及是否阻塞 archive。

      3. **delta spec 同步状态**:对 `openspec/changes/<name>/specs/` 下的每个目录,
         与对应的 `openspec/specs/<capability>/spec.md` 比对,记录:
         - ✓ 已同步
         - ✗ 待同步(列出能力)
         - N/A(没有产出 delta spec)

      4. **设计 / 规格一致性**:抽查 `design.md` 的决策是否体现在 specs 的 requirement 与
         scenario 中。漂移记为警告(非阻塞)。

      5. **落地信号**:确认代码变更都已提交(worktree 内无未 staged 文件)。已知就引用 commit 范围。

      6. **前门路由泄漏检测**(警告,非阻塞):
         使用 superpowers-bridge 的项目,设计产出不应该落在 `docs/superpowers/specs/` ——
         brainstorm 产物的输出重定向(见本 schema 的 brainstorm.instruction)会把它导到
         `openspec/changes/<name>/brainstorm.md`。执行:
           ls docs/superpowers/specs/*.md 2>/dev/null
         如果存在文件,记录警告:"前门路由泄漏 —— 设计产出出现在 docs/superpowers/specs/...,
         这些应落在 openspec/changes/<name>/brainstorm.md 或 design.md。确认内容已进 change 目录后搬移或删除。"
         不阻塞 —— adopter 可能在 schema 安装前就有该目录的合法存量,本检测只负责把泄漏摆上台面,
         由用户决定是否清理。

      7. **延后的人工验证与自动化测试等价性**:
         若 `plan.md` 中有标 `[~]` 延后的任务(本轮没跑的 manual smoke / dogfood /
         现场环境检查),在 verify.md §7 逐项列出,并指出覆盖同一批断言的等价自动化测试。
         若某个延后的人工检查没有等价的自动化测试,该项就是真正的覆盖缺口 —— 记进
         retrospective 的 Misses 并给 follow-up 计划,不要静默延后。
         这张判定表让"延后但已覆盖"与"延后且有缺口"在 archive 时可见,reviewer 不必从
         plan + 测试文件重新推导。
         本身不阻塞 —— 即使识别出缺口,只要都记成 follow-up,总体结论仍可为 PASS。
         仅当 §7 为空、而 plan.md 里存在 `[~]` 行时才阻塞(说明缺口分析被跳过,
         而不是缺口不存在)。

      verify 可以随实现细化反复重跑,每次都用当前状态覆盖 verify.md。

      若 `openspec-verify-change` skill 不可用,改为由执行者手动完成上面编号的检查,
      并把结果写入 verify.md。
    requires:
      - plan

  - id: retrospective
    generates: retrospective.md
    description: 以证据为先的变更复盘
    template: retrospective.md
    instruction: |
      PRECHECK — 验收完成证据(证据型):
      产出 retrospective.md 前,下列命令必须都通过,否则立即停止并告知用户必须先通过 verify。

      1. verify.md 存在:
         test -f openspec/changes/<change-name>/verify.md

      2. verify.md 的总体结论没有被标记为 FAIL。
         verify.md 模板的"总体结论"段有 3 个互斥复选框:"✅ PASS"、"⚠️ PASS WITH WARNINGS"、
         "❌ FAIL"。只有勾上 "❌ FAIL" 才阻塞:
         ! grep -q '^- \[x\] ❌ FAIL' openspec/changes/<change-name>/verify.md

      两条都成功后再继续。

      写一份以证据为先的本次变更复盘。

      重要:时序说明
      - `retrospective.md` 在 apply 完成、且 `verify.md` 没有阻塞项之后产出。
        `requires: [verify]` 这条边只是为了满足 schema 依赖图 —— 真正的复盘必须跑在
        已完成且已验收的实现上。

      三步流程:

      1. **取证据**
         - 在 change worktree(或已合并时的主检出)执行 `git log --oneline <base>..HEAD` 取 commit 范围
         - 读本 change 目录下的 `brainstorm.md`、`plan.md`、`tasks.md` 做计划与实际对比
         - 若 verify.md 里有失败项,先修掉再写复盘

      2. **写复盘各节** —— 每条结论都要引用 commit hash、文件路径、测试名或可度量的事实。

         复盘由 §0 证据(量化前置数据)加 6 个分析小节(§1–§6)组成。
         下游分析条目引用 §0,不要每行都内联 `[evidence: ...]`。

         §0) **证据** —— 量化前置数据,取自 `git log <base>..HEAD`、`tasks.md` 与 verify.md:
             commit 数、diff 规模(行数 / 文件数)、任务完成率、活跃工时、subagent 派发数、
             新增外部依赖、合并后 bug、归档时的 OpenSpec validate 状态、测试覆盖信号、
             以及一行式的 commit 链。

         §1) **收获** —— 哪些地方做得好,附证据

         §2) **失误** —— 哪些地方没做好,按严重程度标记:
             - 🔴 阻塞
             - 🟡 难受
             - 📌 小事

         §3) **计划偏差** —— 范围发生变化的 task,以及原因

         §4) **skill 与工作流执行合规** —— 列出本 schema 在 apply 阶段用到的每个 skill,
             标记是否真的用上。任何 ✗ 都要按下面的规则填写 `### 有意跳过的 Skill` 小节。

         §5) **意外** —— 哪些假设被证伪

         §6) **可沉淀候选 → 长期学习** —— 用 `- [ ]` 清单(不是平铺表格)。每条候选:
             - 标题带严重程度 emoji(🔴/🟡/📌)+ 一句话经验
             - `→ **Promote to** <destination>`(memory / CLAUDE.md / schema / skill / one-off)
             - 两行 body(对齐 feedback memory 体例):
               `> **Why**: <原因>` 与 `> **How to apply**: <触发条件>`

             未勾选的 `- [ ]` 表示在途候选,会带到下一轮复盘重新评估。
             清单 + Why/How 的 body 结构让候选可以机械地转移到 `~/.claude/memory/`,无需重写。

         **§4 的跳过 skill 规则**:

         本 schema 的设计意图是 apply 阶段没有任何 skill 会被跳过 —— 每个 skill 进流程都有理由。
         默认预期:§4 每行都是 ✓。

         任何标 ✗ 的 skill,不要只写一行原因。`### 有意跳过的 Skill` 小节必须逐个回答三问:
         - **跳过了什么**:具体是整个 skill 还是某个 sub-step
         - **本轮为何跳过**:触发这次跳过的具体 cycle 条件。含糊理由("不需要"、"太小"、"没时间"、
           "被外部依赖挡住"、"输出看起来不对")不可接受 —— 必须给出实际触发条件
           (具体的 commit hash、log 行或观察到的行为)。
         - **如何避免复发**:下一轮遇到同类情况该靠什么:
           schema graph fix / skill description tightening / CLAUDE.md trigger /
           scope-judgment rule / 明确写 "one-off — schema boundary case"
           (选最后一项必须写明为何是边界情形,不能只贴标签)。

         若多个 cycle 对同一 skill 给出相同的"如何避免复发"答案,这个模式就是 §6 的
         可沉淀候选(schema / skill 的 PR 动机)。§4 小节是 schema 维护的反馈回路 ——
         它的目标是让下一轮复盘的该小节更短,而不是更长。

      3. **复盘跳过政策**(与 §4 的跳过 skill 不同 —— 这里决定的是要不要写复盘):
         - 单 commit 的琐碎修复:可以整个跳过复盘,在 `retrospective.md` 写一行原因
           (例如 "Skipped: single-commit linter fix, no insights")。
         - 其余情况:必须写 §0 证据 + 全部 6 个分析小节(某节确实没内容时写"未观察到"即可)。

      4. **前进指针政策(事实变化时怎么办)**:
         Retrospective.md 反映写作成文时的事实。若后续 cycle 发现复盘里的某条结论、
         证据或判断有误或不完整:
         - **不要重写**复盘(那会丢掉"当时知道什么"的审计痕迹)
         - 在复盘里追加一条前进指针:
           `> **Update YYYY-MM-DD**: 第 X 节已被 <后续复盘 / commit / issue> 取代`
         - 纠正后的内容由后续产物承载
         原因:复盘以证据为基础,价值在于记录某个特定时点上已知并推理过的内容,
         重写会抹掉审计痕迹。

      按模板结构把产出写入 retrospective.md。
    requires:
      - verify

apply:
  requires: [plan]
  tracks: tasks.md
  instruction: |
    动手实现之前,先搭好隔离工作区与执行者。

    0. **预检**:

       PRECHECK — 依赖 skill 存在性(硬性,不可降级):
       本步骤开始前,确认下列 skill 全部出现在可用 skill 列表中:
         - using-git-worktrees
         - subagent-driven-development
         - test-driven-development
         - requesting-code-review
         - finishing-a-development-branch
       任一缺失:立即停止本步骤,列出缺失的 skill 名称,并提示安装位置
       (`~/.agents/skills/<name>/SKILL.md`,或 superpowers 插件提供的同名 skill)。
       不要自行降级、不要改用其他 skill、不要手写产物绕过。

       其中 test-driven-development 与 requesting-code-review 由 subagent-driven-development
       传递激活,这里一并校验,免得 apply 到一半才发现缺失。

       同时核对项目预期的 CLI 工具在不在 PATH 上。具体清单依项目而定 —— 读 plan.md,
       把里面提到的工具都列出来(如 `mvn`/`mvnw`、`docker`、`python3`、`jq`、`glab`/`gh`、
       `node`/`npm`)。工具缺失记为 **WARNING 而非 STOP** —— 用户可能有替代方案。
       在 apply 开始时一次性打印缺失清单,避免用户在 cycle 中途才发现。

    1. **工作区**:用 Skill 工具调用 **using-git-worktrees**,为本次变更建隔离 git worktree。

    2. **执行者 —— subagent-driven-development**:

       用 Skill 工具调用 **subagent-driven-development**,按 plan.md 的微任务执行,
       每个 task 用一个全新的 subagent。

       交代给执行者:
       - 读本 change 目录下的 `plan.md` 取微任务
       - 粗粒度任务完成时更新 `tasks.md` 复选框
       - 在所建的 worktree 内工作

       重要 —— 传递激活:
       subagent-driven-development 内部强制以下 skill,无需手工调用:
       - **test-driven-development** —— 每个 task 走 RED-GREEN-REFACTOR。
         先写实现代码的必须删掉。
       - **requesting-code-review** —— 每个 task 之后派 code-reviewer subagent,
         抓 spec 符合度与代码质量问题;apply 结束前再对整个实现做一次最终评审。

       本 schema **不支持**用 `executing-plans` 作为无 subagent 平台的替代 ——
       按其 SKILL.md,executing-plans 不会传递激活 TDD 与 code-review,
       会丢掉 superpowers 带来的核心严谨性。没有 subagent 支持的平台请改用内置
       `spec-driven` schema。

    3. **验证**:所有 task 完成后,调用 **openspec-verify-change** 产出 `verify` 产物,
       检查完整性、正确性与一致性。重复 verify 直到没有阻塞项。

    4. **复盘(趁热写)**:verify.md 没有阻塞项后、**开 PR 之前**产出 `retrospective` 产物
       (执行该产物自己的 instruction,内含 PRECHECK:确认 verify.md 存在且不是 FAIL)。
       为什么不是 PR 之后:复盘是本轮交付物,应落在同一个 PR 里。PR 合并后再写会变成
       一条拖尾 commit,并丢掉当时的上下文(测试结果、修 bug 的新鲜记忆)。

    5. **归档(同步 spec delta + 移动目录)**:retrospective.md 写好后,执行
       `openspec archive -y`(等价 `/opsx:archive`)。这一步:
       - 把 `openspec/changes/<name>/specs/` 的 delta spec 同步进
         `openspec/specs/<capability>/spec.md`
       - 把 change 目录移到 `openspec/changes/archive/YYYY-MM-DD-<name>/`
       归档后的 PR diff 才是本轮完整状态:8 个产物齐备 + spec 已同步 + change 已归档。

    6. **收尾(PR 是最后一步)**:retrospective 与 archive 都完成后,用 Skill 工具调用
       **finishing-a-development-branch**。分支的 PR diff 必须包含完整的归档 cycle;
       若缺失(例如 retrospective 或 archive 被跳过),先补齐再继续。
       这是开启 PR 的标准顺序,不得重排。
